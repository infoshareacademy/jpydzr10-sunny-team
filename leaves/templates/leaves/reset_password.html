{% extends 'base.html' %}

{% block title %}Reset hasła{% endblock %}

{% block content %}
<div class="section">
    <h1>Reset hasła użytkownika</h1>

    {% if messages %}
        {% for message in messages %}
            <div style="padding:12px; margin:15px 0; border-radius:6px;
                        background:{% if 'success' in message.tags %}#d4edda{% else %}#f8d7da{% endif %};">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label>Wybierz użytkownika:</label>
        <select name="user_id" required>
            <option value="">--- Wybierz użytkownika ---</option>
            {% for user in users %}
            <option value="{{ user.id }}">{{ user.username }} ({{ user.first_name }} {{ user.last_name }})</option>
            {% endfor %}
        </select>

        <label>Nowe hasło (min. 6 znaków):</label>
        <input type="password" name="new_password" required minlength="6">

        <button type="submit" style="background:#dc3545; color:white; padding:12px 20px; margin-top:15px;">
            Zresetuj hasło
        </button>
    </form>
</div>
{% endblock %}
