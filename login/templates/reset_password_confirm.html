{% extends 'base.html' %}

{% block title %}Reset hasła{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4">Ustaw nowe hasło</h2>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="password" class="form-label">Nowe hasło</label>
                    <input type="password" name="password" id="password" class="form-control" autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Ustaw hasło</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
