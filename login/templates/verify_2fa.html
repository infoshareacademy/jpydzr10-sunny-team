{% extends 'base.html' %}

{% block title %}Weryfikacja 2FA{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4">Weryfikacja dwuetapowa</h2>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="code" class="form-label">Kod weryfikacyjny</label>
                    <input type="text" name="code" id="code" class="form-control" maxlength="6" autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Zweryfikuj</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
