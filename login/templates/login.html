{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Logowanie – Sunny</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            font-family: 'Segoe UI', sans-serif;
            background: #f0f4f8;
        }

        .login-wrapper {
            display: flex;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .login-card {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
        }

        /* === LEWA STRONA – grafika === */
        .login-visual {
            flex: 1;
            background: lightskyblue;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 2rem;
            position: relative;
            overflow: hidden;
        }

        .sun-icon {
            font-size: 5rem;
            color: #ffdf22;
            animation: spinSun 20s linear infinite;
            display: inline-block;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.15));
        }
        @keyframes spinSun {
            to { transform: rotate(360deg); }
        }

        .brand-name {
            font-size: 2.4rem;
            font-weight: 700;
            color: white;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.2);
            margin-top: 0.5rem;
            letter-spacing: 1px;
        }

        .brand-tagline {
            color: rgba(255,255,255,0.9);
            font-size: 1rem;
            margin-top: 0.4rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
        }

        .visual-illustration {
            margin-top: 2rem;
            width: 100%;
        }

        .birds {
            position: absolute;
            top: 48px;
            left: 36px;
        }

        .palm-left {
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .palm-right {
            position: absolute;
            bottom: 0;
            right: 0;
            transform: scaleX(-1);
        }

        .mountains {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
        }

        /* === PRAWA STRONA – formularz === */
        .login-form-side {
            width: 360px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem 2.5rem;
        }

        .form-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 0.3rem;
        }

        .form-subtitle {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 2rem;
        }

        .form-label {
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 5px;
            display: block;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #dde2e8;
            border-radius: 10px;
            font-size: 0.95rem;
            color: #2c3e50;
            background: #f8f9fa;
            transition: border-color 0.2s;
            margin-bottom: 1.2rem;
        }
        .form-control:focus {
            outline: none;
            border-color: lightskyblue;
            background: white;
            box-shadow: 0 0 0 3px rgba(135,206,235,0.2);
        }

        .error-list {
            background: #fff3f3;
            border: 1px solid #f5c6c6;
            border-radius: 10px;
            padding: 10px 14px;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
            color: #c0392b;
            list-style: none;
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            background: lightskyblue;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
            transition: background 0.2s, transform 0.1s;
            margin-top: 0.3rem;
        }
        .btn-login:hover {
            background: #6ab8d8;
        }
        .btn-login:active {
            transform: scale(0.98);
        }

        .login-footer {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.78rem;
            color: #bbb;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">

        <!-- LEWA: grafika -->
        <div class="login-visual">

            <!-- ptaki -->
            <svg class="birds" width="70" height="24" viewBox="0 0 70 24" fill="none">
                <path d="M0 12 Q6 4 12 12" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <path d="M18 8 Q24 0 30 8" stroke="white" stroke-width="2" stroke-linecap="round"/>
                <path d="M42 14 Q48 6 54 14" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>

            <!-- palma lewa -->
            <svg class="palm-left" width="90" height="160" viewBox="0 0 90 160">
                <rect x="36" y="70" width="10" height="90" rx="5" fill="#5a8a3a"/>
                <ellipse cx="41" cy="72" rx="34" ry="11" fill="#4a7a2a" transform="rotate(-25 41 72)"/>
                <ellipse cx="41" cy="66" rx="30" ry="10" fill="#5a8a3a" transform="rotate(10 41 66)"/>
                <ellipse cx="41" cy="63" rx="26" ry="9" fill="#4a7a2a" transform="rotate(-38 41 63)"/>
                <ellipse cx="41" cy="68" rx="24" ry="9" fill="#5a8a3a" transform="rotate(28 41 68)"/>
                <ellipse cx="41" cy="60" rx="20" ry="8" fill="#4a7a2a" transform="rotate(-52 41 60)"/>
            </svg>

            <!-- palma prawa -->
            <svg class="palm-right" width="90" height="160" viewBox="0 0 90 160">
                <rect x="36" y="70" width="10" height="90" rx="5" fill="#5a8a3a"/>
                <ellipse cx="41" cy="72" rx="34" ry="11" fill="#4a7a2a" transform="rotate(-25 41 72)"/>
                <ellipse cx="41" cy="66" rx="30" ry="10" fill="#5a8a3a" transform="rotate(10 41 66)"/>
                <ellipse cx="41" cy="63" rx="26" ry="9" fill="#4a7a2a" transform="rotate(-38 41 63)"/>
                <ellipse cx="41" cy="68" rx="24" ry="9" fill="#5a8a3a" transform="rotate(28 41 68)"/>
                <ellipse cx="41" cy="60" rx="20" ry="8" fill="#4a7a2a" transform="rotate(-52 41 60)"/>
            </svg>

            <!-- góry / woda na dole -->
            <svg class="mountains" viewBox="0 0 500 130" preserveAspectRatio="none">
                <polygon points="0,130 80,50 170,95 260,25 350,75 440,35 500,60 500,130" fill="rgba(255,255,255,0.12)"/>
                <polygon points="0,130 60,70 150,105 240,50 330,90 420,55 500,75 500,130" fill="rgba(255,255,255,0.08)"/>
                <rect x="0" y="105" width="500" height="25" fill="rgba(255,255,255,0.18)"/>
            </svg>

            <!-- logo i tekst -->
            <i class="bi bi-sun-fill sun-icon"></i>
            <div class="brand-name">Sunny</div>
            <div class="brand-tagline">System zarządzania urlopami</div>
        </div>

        <!-- PRAWA: formularz -->
        <div class="login-form-side">
            <div class="form-title">Witaj z powrotem 👋</div>
            <div class="form-subtitle">Zaloguj się do swojego konta</div>

            {% if form.non_field_errors %}
            <ul class="error-list">
                {% for error in form.non_field_errors %}
                <li><i class="bi bi-exclamation-circle"></i> {{ error }}</li>
                {% endfor %}
            </ul>
            {% endif %}

            <form method="post">
                {% csrf_token %}

                <label class="form-label" for="id_username">Nazwa użytkownika</label>
                <input
                    class="form-control {% if form.username.errors %}border-danger{% endif %}"
                    type="text"
                    id="id_username"
                    name="username"
                    value="{{ form.username.value|default:'' }}"
                    required
                    autofocus
                >

                <label class="form-label" for="id_password">Hasło</label>
                <input
                    class="form-control {% if form.password.errors %}border-danger{% endif %}"
                    type="password"
                    id="id_password"
                    name="password"
                    required
                >

                <button type="submit" class="btn-login">
                    <i class="bi bi-box-arrow-in-right"></i> Zaloguj się
                </button>
            </form>

            <div class="login-footer">© 2026 SunnyTeam</div>
        </div>

    </div>
</div>
</body>
</html>
