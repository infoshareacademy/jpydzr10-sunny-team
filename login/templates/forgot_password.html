{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Przypomnienie hasła" %}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h2 class="text-center mb-4">{% trans "Przypomnij hasło" %}</h2>
            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="email" class="form-label">{% trans "Adres email" %}</label>
                    <input type="email" name="email" id="email" class="form-control" autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">{% trans "Wyślij link resetu" %}</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
