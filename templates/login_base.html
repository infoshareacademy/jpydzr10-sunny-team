{% load static %}
{% load i18n %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE|default:'pl' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% trans "Sunny" %}{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #eef3f8;
            margin: 0;
            overflow-x: hidden;
        }

        .login-wrapper {
            width: 100vw;
            min-height: 100vh;
            padding: 20px;
        }

        .login-card {
            width: 1280px;
            height: 720px;
            border-radius: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.15);
        }

        .login-visual {
            width: 800px;
            height: 720px;
            background-image: url("{% static 'images/login_background.jpeg' %}");
            background-repeat: no-repeat;
            background-size: cover;
            background-position: bottom center;
        }

        .brand-group {
            top: 10%;
            z-index: 5;
        }

        .sun-icon {
            font-size: 8rem;
            color: #ffd000;
            animation: spinSun 30s linear infinite;
            filter: drop-shadow(0 4px 15px rgba(255, 208, 0, 0.6));
        }

        @keyframes spinSun {
            to { transform: rotate(360deg); }
        }

        .brand-name {
            font-size: 4rem;
            text-shadow: 0 3px 10px rgba(0, 0, 0, 0.35);
            letter-spacing: 1.5px;
        }

        .brand-tagline {
            font-size: 1.2rem;
            letter-spacing: 0.8px;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
            opacity: 0.95;
        }

        .birds {
            top: 45px;
            left: 55px;
            width: 90px;
            z-index: 2;
        }

        .floating-cloud {
            position: absolute;
            color: rgba(255, 255, 255, 0.92);
            pointer-events: none;
            white-space: nowrap;
            will-change: transform;
            line-height: 1;
        }

        .cloud-bg {
            z-index: 3;
            filter: blur(3px) drop-shadow(0 6px 15px rgba(255, 255, 255, 0.4));
        }

        .cloud-fg {
            z-index: 6;
            filter: blur(3px) drop-shadow(0 10px 22px rgba(255, 255, 255, 0.65));
        }

        .cloud-1 { top: 5%; font-size: 10rem; opacity: 0.5; animation: moveRight 55s linear infinite; animation-delay: -10s; }
        .cloud-2 { top: 20%; font-size: 7rem; opacity: 0.6; animation: moveLeft 70s linear infinite; animation-delay: -30s; }
        .cloud-3 { top: 35%; font-size: 9rem; opacity: 0.45; animation: moveRight 85s linear infinite; animation-delay: -50s; }
        .cloud-4 { top: 12%; font-size: 11rem; opacity: 0.4; animation: moveLeft 65s linear infinite; animation-delay: -5s; }
        .cloud-5 { top: 28%; font-size: 8rem; opacity: 0.4; animation: moveRight 50s linear infinite; animation-delay: -25s; }
        .cloud-6 { top: 45%; font-size: 6rem; opacity: 0.5; animation: moveLeft 80s linear infinite; animation-delay: -60s; }

        @keyframes moveRight {
            0% { transform: translateX(-400px); }
            100% { transform: translateX(1000px); }
        }

        @keyframes moveLeft {
            0% { transform: translateX(1000px); }
            100% { transform: translateX(-400px); }
        }

        .login-form-side {
            width: 480px;
            height: 720px;
            padding: 4rem 3rem;
        }

        .toggle-password {
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
        }

        .language-select {
            min-width: 160px;
            font-weight: 500;
            padding: 0.45rem 2.25rem 0.45rem 0.85rem;
            border-radius: 10px;
        }

        .footer-copyright {
            font-size: 0.95rem;
            font-weight: 500;
            color: #6c757d;
        }

        @media (max-width: 991px) {
            .login-wrapper { padding: 10px; }
            .login-card { width: 100% !important; max-width: 480px; height: auto !important; flex-direction: column; }
            .login-visual { width: 100%; height: auto !important; aspect-ratio: 2.1 / 1; container-type: inline-size; }
            .brand-group { top: 50% !important; left: 0 !important; transform: translateY(-65%) !important; width: 100% !important; }
            .sun-icon { font-size: 9.5cqw !important; margin: 0 auto !important; }
            .brand-name { font-size: 7.5cqw !important; letter-spacing: 0.03em !important; text-shadow: 0 0.4cqw 1cqw rgba(0, 0, 0, 0.45); }
            .brand-tagline { font-size: 3.1cqw !important; letter-spacing: 0.02em !important; text-shadow: 0 0.3cqw 0.8cqw rgba(0, 0, 0, 0.55); }
            .birds { top: 8%; left: 5%; width: 11cqw !important; }
            .floating-cloud { display: none !important; }
            .login-form-side { width: 100%; height: auto; padding: 1.5rem 1.25rem; }
        }
    </style>
</head>
<body class="bg-light">

<div class="login-wrapper d-flex align-items-center justify-content-center">
    <div class="login-card d-flex bg-white overflow-hidden flex-shrink-0 m-auto" id="loginCard">

        <!-- Lewa sekcja wizualna -->
        <div class="login-visual position-relative overflow-hidden">
            <svg class="birds position-absolute" viewBox="0 0 70 24" fill="none">
                <path d="M0 12 Q6 4 12 12" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M18 8 Q24 0 30 8" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                <path d="M42 14 Q48 6 54 14" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
            <i class="bi bi-cloudy-fill floating-cloud cloud-bg cloud-1"></i>
            <i class="bi bi-cloudy-fill floating-cloud cloud-bg cloud-2"></i>
            <i class="bi bi-cloudy-fill floating-cloud cloud-bg cloud-3"></i>
            <div class="brand-group position-absolute start-0 w-100 d-flex flex-column text-center">
                <i class="bi bi-sun-fill sun-icon mb-1"></i>
                <div class="brand-name fw-bold text-white lh-1">Sunny</div>
                <div class="brand-tagline text-white fw-semibold mt-2">{% trans "System zarządzania urlopami" %}</div>
            </div>
            <i class="bi bi-cloudy-fill floating-cloud cloud-fg cloud-4"></i>
            <i class="bi bi-cloudy-fill floating-cloud cloud-fg cloud-5"></i>
            <i class="bi bi-cloudy-fill floating-cloud cloud-fg cloud-6"></i>
        </div>

        <!-- Prawa sekcja formularza -->
        <div class="login-form-side bg-white d-flex flex-column justify-content-between">
            <div>
                {% block form_content %}{% endblock %}
            </div>

            <!-- Stopka i język -->
            <div>
                <div class="d-flex justify-content-center pt-3">
                    <form action="{% url 'set_language' %}" method="post">
                        {% csrf_token %}
                        <input name="next" type="hidden" value="{{ request.path }}">
                        <select name="language" class="form-select language-select shadow-sm" onchange="this.form.submit()">
                            <option value="pl" {% if LANGUAGE_CODE == 'pl' %}selected{% endif %}>🇵🇱 Polski</option>
                            <option value="en" {% if LANGUAGE_CODE == 'en' %}selected{% endif %}>🇬🇧 English</option>
                        </select>
                    </form>
                </div>
                <div class="text-center footer-copyright mt-3">{% trans "© 2026 SunnyTeam" %}</div>
            </div>
        </div>

    </div>
</div>

<script>
    const card = document.getElementById('loginCard');

    function fitCard() {
        if (window.innerWidth < 992) {
            card.style.zoom = '1';
            card.style.transform = 'none';
            return;
        }

        const scale = Math.min((window.innerWidth - 40) / 1280, (window.innerHeight - 40) / 720, 1);

        if ('zoom' in card.style) {
            card.style.zoom = scale;
            card.style.transform = 'none';
        } else {
            card.style.transform = `scale(${scale})`;
            card.style.transformOrigin = 'center center';
        }
    }

    window.addEventListener('resize', fitCard);
    window.addEventListener('DOMContentLoaded', fitCard);
</script>
{% block extra_js %}{% endblock %}
</body>
</html>
