{% extends "login_base.html" %}
{% load i18n %}

{% block title %}{% trans "Hasło zmienione – Sunny" %}{% endblock %}

{% block form_content %}
<div class="text-center my-auto py-4">
    <div class="text-success display-4 mb-3">
        <i class="bi bi-check-circle-fill"></i>
    </div>
    <h1 class="h4 fw-bold text-dark mb-2">{% trans "Hasło zostało zmienione!" %}</h1>
    <p class="text-secondary small mb-4">
        {% trans "Twoje nowe hasło jest już aktywne. Możesz się zalogować." %}
    </p>

    <a href="{% url 'login' %}" class="btn btn-primary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2">
        <i class="bi bi-box-arrow-in-right"></i> {% trans "Zaloguj się" %}
    </a>
</div>
{% endblock %}
