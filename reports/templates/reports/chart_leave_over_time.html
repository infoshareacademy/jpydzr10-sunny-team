{% extends 'base.html' %}
{% load i18n %}

{% block title %}{% trans "Urlopy w czasie" %}{% endblock %}

{% block content %}
<div class="container mt-5">
    <h2 class="text-center mb-4">{% trans "Urlopy w czasie" %}</h2>
    <canvas id="leaveChart" width="800" height="400"></canvas>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const ctx = document.getElementById('leaveChart').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: {{ labels|safe }},
            datasets: [{
                label: 'Liczba wniosków',
                data: {{ values|safe }},
                borderColor: 'rgb(75, 192, 192)',
                tension: 0.1
            }]
        }
    });
</script>
{% endblock %}
